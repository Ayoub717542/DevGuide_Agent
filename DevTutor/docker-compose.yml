services:
  backend:
    build: .
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://host.docker.internal:3307/devguide
      QDRANT_HOST: qdrant
      PISTON_URL: http://piston:2000
      GOTENBERG_URL: http://gotenberg:3000
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    volumes:
      - model_cache:/root/.devtutor/model-cache
    depends_on:
      - qdrant
      - piston
      - gotenberg

  qdrant:
    image: qdrant/qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - devtutor_qdrant_data:/qdrant/storage

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: 15000
      PISTON_RUN_CPU_TIME: 15000
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_data:/piston

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  devtutor_qdrant_data:
    external: true
  piston_data:
    external: true
  model_cache:

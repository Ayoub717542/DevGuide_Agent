<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background:#F6F8FA;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F8FA;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #D0D7DE;border-radius:12px;">
          <tr>
            <td style="padding:32px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#1F2328;">
              <p style="margin:0 0 24px;font-size:16px;font-weight:600;">DevGuide</p>
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:600;line-height:1.3;">{{title}}</h1>
              <p style="margin:0 0 8px;font-size:15px;line-height:1.5;">Hi {{name}},</p>
              <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#59636E;">{{text}}</p>
              <a href="{{link}}" style="display:inline-block;background:#0E1117;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">{{buttonLabel}}</a>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#59636E;">Button not working? Paste this link into your browser:<br><a href="{{link}}" style="color:#0969DA;word-break:break-all;">{{link}}</a></p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #D0D7DE;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#59636E;">
              If you didn't ask for this, you can ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
